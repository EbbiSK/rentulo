<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title data-i18n="reservations.pageTitle">Moje rezervace - Rentulo</title>
<link rel="stylesheet" href="css/account-pages.css" />
  <link rel="stylesheet" href="css/my-reservations.css" />
  <link rel="stylesheet" href="css/compact-records.css" />

  <style>
    /* Mint visual refresh for My reservations. Functional behavior stays unchanged. */
    body {
      background: #dff7ee !important;
      color: #173f35;
    }

    .header {
      padding-top: 12px !important;
      padding-bottom: 12px !important;
    }

    .logo-icon {
      width: 48px !important;
      height: 48px !important;
      flex-basis: 48px !important;
    }

    .logo-text strong {
      font-size: 25px !important;
      color: #173f35 !important;
    }

    .account-page-header {
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid #c9e2d6;
      border-radius: 20px;
      padding: 22px 185px 22px 22px !important;
      box-shadow: 0 12px 32px rgba(23, 63, 53, 0.06);
    }

    .account-page-header h1,
    .reservation-section-header h2,
    .account-empty-state h2 {
      color: #173f35 !important;
    }

    .top-action-button {
      right: 20px !important;
      top: 50% !important;
      transform: translateY(-50%);
      background: #73d64d !important;
      color: #173a22 !important;
      box-shadow: none !important;
    }

    .top-action-button:hover {
      background: #68c547 !important;
    }

    .reservation-section-header,
    .reservation-table-card,
    .reservation-card,
    .account-empty-state,
    .section-empty-note {
      border: 1px solid #cfe4da !important;
      box-shadow: 0 12px 32px rgba(23, 63, 53, 0.055) !important;
    }

    .reservation-section-header,
    .reservation-table th,
    .detail-row td,
    .reservation-detail-panel {
      background: #f7fcf9 !important;
    }

    .reservation-row:hover {
      background: #f4fbf7 !important;
    }

    .tool-thumb,
    .info-box {
      background: #f4fbf7 !important;
      border-color: #cfe4da !important;
    }

    .status-pill,
    .status-rejected,
    .payment-box.waiting,
    .contact-box.hidden,
    .reservation-state-box.rejected {
      background: #fff3e8 !important;
      border-color: #f2c79f !important;
      color: #8a4b16 !important;
    }

    .payment-box.waiting strong,
    .contact-box.hidden strong,
    .reservation-state-box.rejected strong {
      color: #8a4b16 !important;
    }

    .reservation-card.priority {
      border-color: #f2c79f !important;
      box-shadow: 0 12px 30px rgba(138, 75, 22, 0.08) !important;
    }

    .small-button.orange,
    .reservation-primary-action.orange {
      background: #ff6a00 !important;
      color: #ffffff !important;
    }

    .small-button.orange:hover,
    .reservation-primary-action.orange:hover {
      background: #e85f00 !important;
    }

    .small-button,
    .btn-register,
    .logout-link {
      background: #73d64d !important;
      color: #173a22 !important;
    }

    .small-button.light,
    .reservation-primary-action:not(.orange) {
      background: #edf6f1 !important;
      color: #173f35 !important;
    }

    .small-button.reservation-cancel-action {
      background: #fff7f5 !important;
      border: 1px solid #efc7be !important;
      color: #9a3f2d !important;
    }

    .small-button.reservation-cancel-action:hover {
      background: #fcece8 !important;
    }

    /* Keep the global keyboard focus outline, but remove the older double-ring shadow. */
    .reservation-primary-action:focus {
      outline: none;
      box-shadow: none !important;
    }

    .reservation-primary-action:focus-visible {
      box-shadow: none !important;
    }

    @media (max-width: 980px) {
      .account-page-header {
        padding: 20px !important;
      }

      .top-action-button {
        position: static !important;
        transform: none !important;
        width: 100%;
        margin-top: 16px !important;
      }

      .reservation-row,
      .reservation-card {
        border-color: #cfe4da !important;
      }
    }
  </style>
</head>

<body data-navigation-page="muj-ucet">

  <header class="header">
    <a href="index.html" class="logo">
      <div class="logo-icon">
        <img src="assets/rentulo-logo-mark.png" alt="" aria-hidden="true" />
      </div>

      <div class="logo-text">
        <strong>Rentulo</strong>
      </div>
    </a>

    <nav class="nav" id="mainNav"></nav>
  </header>

  <main class="account-page">

    <a href="muj-ucet.html" class="back-link" data-rentulo-back="true" data-i18n="reservations.back">← Zpět</a>

    <section class="account-page-header">
      

      <h1 data-i18n="reservations.heading">Moje rezervace</h1>

      <p data-i18n="reservations.description">Spravujte své rezervace a jejich průběh.</p>

      <a href="vysledky.html" class="top-action-button" data-i18n="reservations.findItem">Najít věc</a>
    </section>

    <div
      class="reservation-page-notice"
      id="reservationsNotice"
      role="status"
      aria-live="polite"
      hidden
    ></div>

    <section class="account-list" id="reservationsList"></section>

    <div
      class="reservation-confirm-modal"
      id="reservationCancelModal"
      aria-hidden="true"
      hidden
    >
      <div
        class="reservation-confirm-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="reservationCancelModalTitle"
        aria-describedby="reservationCancelModalDescription"
      >
        <h2 id="reservationCancelModalTitle">Zrušit rezervaci?</h2>
        <p id="reservationCancelModalDescription">
          Opravdu chcete tuto rezervaci zrušit? Termín se znovu uvolní.
        </p>

        <div class="reservation-confirm-actions">
          <button
            type="button"
            class="reservation-modal-button reservation-modal-keep"
            data-reservations-cancel-modal-action="keep"
          >
            Ponechat rezervaci
          </button>
          <button
            type="button"
            class="reservation-modal-button reservation-modal-cancel"
            data-reservations-cancel-modal-action="confirm"
          >
            Zrušit rezervaci
          </button>
        </div>
      </div>
    </div>

  </main>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/reservation-utils.js"></script>
<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/storage.js"></script>
<script src="js/navigation.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/reservation-status.js"></script>
<script src="js/reservations.js"></script>
<script src="js/reservations-page.js"></script>
</body>
</html>
