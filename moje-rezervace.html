<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title data-i18n="reservations.pageTitle">Moje rezervace - Rentulo</title>
  <link rel="icon" type="image/png" href="assets/rentulo-logo-mark.png" />
  <link rel="stylesheet" href="css/account-pages.css" />
  <link rel="stylesheet" href="css/my-reservations.css" />
  <link rel="stylesheet" href="css/compact-records.css" />
  <style>
    /* My reservations follows the calmer visual hierarchy used on My offers. */
    body {
      background: #dff7ee !important;
      color: #173f35;
    }

    .header {
      padding-top: 12px !important;
      padding-bottom: 12px !important;
    }

    .logo-icon {
      width: 48px !important;
      height: 48px !important;
      flex-basis: 48px !important;
    }

    .logo-text strong {
      font-size: 25px !important;
      color: #173f35 !important;
    }

    .logo-text small {
      display: none !important;
    }

    .account-page {
      padding-top: 18px !important;
    }

    .back-link {
      color: #3f8f2d !important;
    }

    .account-page-header {
      margin-bottom: 16px !important;
      padding: 20px 190px 20px 20px !important;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid #cde5da;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(23, 63, 53, 0.05);
    }

    .account-page-header h1,
    .reservation-section-header h2,
    .account-empty-state h2 {
      color: #173f35 !important;
    }

    .top-action-button {
      top: 50% !important;
      right: 20px !important;
      transform: translateY(-50%);
      background: #73d64f !important;
      color: #173a22 !important;
      box-shadow: none !important;
    }

    .top-action-button:hover {
      background: #63c943 !important;
    }

    .reservation-page-notice {
      background: #eff9f4 !important;
      border-color: #c9e2d6 !important;
      box-shadow: 0 10px 26px rgba(23, 63, 53, 0.04);
    }

    .reservation-section {
      gap: 10px !important;
    }

    .reservation-section-header {
      padding: 10px 12px !important;
      border: 1px solid #cfe3da !important;
      border-radius: 14px !important;
      background: rgba(255, 255, 255, 0.82) !important;
      box-shadow: 0 10px 26px rgba(23, 63, 53, 0.045) !important;
    }

    .reservation-section-header span {
      background: #eef8e9 !important;
      color: #4f9f2f !important;
    }

    .reservation-card-list {
      gap: 10px !important;
    }

    /* Main reservation row: same quiet card rhythm as My offers. */
    .simple-reservation-row {
      grid-template-columns:
        minmax(250px, 1.55fr)
        minmax(160px, 0.9fr)
        minmax(80px, 0.42fr)
        minmax(140px, auto)
        minmax(230px, auto) !important;
      gap: 12px 14px !important;
      min-height: 62px !important;
      padding: 8px 12px !important;
      margin-bottom: 0 !important;
      border: 1px solid #cfe3da !important;
      border-radius: 15px !important;
      background: #ffffff !important;
      box-shadow: 0 10px 26px rgba(23, 63, 53, 0.045) !important;
      overflow: hidden;
    }

    .simple-reservation-row.priority {
      border-color: #cfe3da !important;
      box-shadow: 0 10px 26px rgba(23, 63, 53, 0.045) !important;
    }

    .simple-reservation-main {
      display: flex !important;
      align-items: center !important;
      gap: 10px !important;
      min-width: 0;
    }

    .simple-reservation-main .tool-thumb,
    .simple-reservation-main .tool-image {
      width: 42px !important;
      height: 42px !important;
      flex-basis: 42px !important;
      border-radius: 10px !important;
      background: #edf7f2 !important;
      border-color: #d5e7df !important;
    }

    .simple-reservation-info strong {
      color: #173f35 !important;
      font-size: 14px !important;
      font-weight: 900 !important;
    }

    .simple-reservation-info span {
      display: block;
      margin-top: 2px;
      color: #65746e !important;
    }

    .simple-reservation-date,
    .simple-reservation-price {
      color: #173f35 !important;
      font-weight: 800 !important;
    }

    .simple-reservation-status {
      min-height: 28px !important;
      padding: 5px 10px !important;
      border-radius: 999px !important;
      border: 1px solid transparent;
    }

    .status-pending,
    .status-approved {
      background: #fff3e8 !important;
      border-color: #f2c79f !important;
      color: #8a4b16 !important;
    }

    .status-paid,
    .status-picked_up {
      background: #eef8e9 !important;
      border-color: #c9e2d6 !important;
      color: #4f9f2f !important;
    }

    .status-returned,
    .status-completed,
    .status-cancelled,
    .status-canceled,
    .status-rejected,
    .status-declined {
      background: #eef1ed !important;
      border-color: #dce5df !important;
      color: #334c43 !important;
    }

    .simple-reservation-actions {
      gap: 7px !important;
      flex-wrap: wrap !important;
    }

    .simple-reservation-actions .reservation-primary-action {
      min-height: 36px !important;
      padding: 8px 12px !important;
      border-radius: 10px !important;
      box-shadow: none !important;
    }

    /* Reservation detail is the main navigation action. */
    .simple-reservation-actions [data-reservations-action="toggle-detail"] {
      background: #73d64f !important;
      color: #173a22 !important;
    }

    .simple-reservation-actions [data-reservations-action="toggle-detail"]:hover {
      background: #63c943 !important;
    }

    .simple-reservation-actions .offer-detail-link {
      background: #edf5f1 !important;
      color: #173f35 !important;
    }

    .simple-reservation-actions .offer-detail-link:hover {
      background: #e2f0e9 !important;
    }

    /* Payment is the primary next action; keep the status orange and the action green. */
    .simple-reservation-actions .reservation-primary-action.orange {
      background: #73d64f !important;
      color: #173a22 !important;
      border: 1px solid #73d64f !important;
    }

    .simple-reservation-actions .reservation-primary-action.orange:hover {
      background: #63c943 !important;
      border-color: #63c943 !important;
    }

    /* Test payment confirmation uses the same Rentulo modal, with a green primary action. */
    .reservation-modal-pay {
      background: #73d64f !important;
      border-color: #73d64f !important;
      color: #173a22 !important;
    }

    .reservation-modal-pay:hover {
      background: #63c943 !important;
      border-color: #63c943 !important;
    }

    /* When payment is available, it is the one attention action; detail becomes secondary. */
    .simple-reservation-actions:has(.reservation-primary-action.orange)
      [data-reservations-action="toggle-detail"],
    .simple-reservation-row:has(.detail-row.open)
      [data-reservations-action="toggle-detail"] {
      background: #edf5f1 !important;
      color: #173f35 !important;
    }

    .simple-reservation-actions:has(.reservation-primary-action.orange)
      [data-reservations-action="toggle-detail"]:hover,
    .simple-reservation-row:has(.detail-row.open)
      [data-reservations-action="toggle-detail"]:hover {
      background: #e2f0e9 !important;
    }

    /* Expanded reservation: one calm block, without repeating the whole row visually. */
    .simple-reservation-row .detail-row {
      grid-column: 1 / -1 !important;
      margin: 2px -12px -8px !important;
      padding: 0 12px 12px !important;
      border-top: 1px solid #d5e7df !important;
      background: #f5fbf8 !important;
    }

    .simple-reservation-row .detail-row.open {
      display: block !important;
    }

    .detail-row .reservation-detail-panel {
      margin: 0 !important;
      padding: 14px 0 0 !important;
      gap: 10px !important;
      border: 0 !important;
      border-radius: 0 !important;
      background: transparent !important;
      box-shadow: none !important;
    }

    .detail-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
      gap: 9px !important;
    }

    /* Fee and owner payout are not decision-critical for the renter here. */
    .detail-grid .info-box:nth-child(4),
    .detail-grid .info-box:nth-child(5) {
      display: none !important;
    }

    .info-box {
      min-height: 58px !important;
      padding: 10px 11px !important;
      background: rgba(255, 255, 255, 0.86) !important;
      border-color: #d5e7df !important;
      border-radius: 12px !important;
    }

    .payment-box,
    .contact-box,
    .reservation-state-box,
    .review-box {
      padding: 11px 12px !important;
      border-radius: 12px !important;
    }

    .reservation-state-box.active,
    .payment-box.paid,
    .contact-box.visible {
      background: #eff9f4 !important;
      border-color: #c9e2d6 !important;
      color: #173f35 !important;
    }

    .reservation-state-box.rejected,
    .payment-box.waiting {
      background: #fff3e8 !important;
      border-color: #f2c79f !important;
      color: #8a4b16 !important;
    }

    .contact-box.hidden {
      background: rgba(255, 255, 255, 0.86) !important;
      border-color: #d5e7df !important;
      color: #173f35 !important;
    }

    .contact-box.hidden strong {
      color: #173f35 !important;
    }

    .reservation-state-box.finished {
      background: #f1f4f2 !important;
      border-color: #dce5df !important;
      color: #334c43 !important;
    }

    .review-box {
      background: rgba(255, 255, 255, 0.86) !important;
      border-color: #d5e7df !important;
    }

    .small-button.light,
    .contact-map-link {
      background: #edf5f1 !important;
      color: #173f35 !important;
    }

    .small-button.light:hover,
    .contact-map-link:hover {
      background: #e2f0e9 !important;
    }

    .small-button.reservation-cancel-action {
      background: #fff8f6 !important;
      color: #a43b2f !important;
      border: 1px solid #efc1b7 !important;
    }

    .small-button.reservation-cancel-action:hover {
      background: #fff0ec !important;
    }

    .reservation-detail-actions {
      padding-top: 1px !important;
    }

    .reservation-primary-action:focus,
    .reservation-primary-action:focus-visible {
      outline: none;
      box-shadow: none !important;
    }

    .section-empty-note,
    .account-empty-state {
      border: 1px solid #cfe3da !important;
      box-shadow: 0 10px 26px rgba(23, 63, 53, 0.045) !important;
    }

    .account-empty-state a {
      background: #73d64f !important;
      color: #173a22 !important;
    }

    @media (max-width: 1100px) {
      .simple-reservation-row {
        grid-template-columns:
          minmax(230px, 1.45fr)
          minmax(150px, 0.85fr)
          minmax(74px, 0.4fr)
          minmax(130px, auto)
          minmax(205px, auto) !important;
        gap: 10px !important;
      }

      .simple-reservation-actions .reservation-primary-action {
        padding-left: 10px !important;
        padding-right: 10px !important;
      }
    }

    @media (max-width: 900px) {
      .account-page-header {
        padding: 18px !important;
      }

      .top-action-button {
        position: static !important;
        transform: none !important;
        width: 100%;
        justify-content: center;
        margin-top: 14px !important;
      }

      .simple-reservation-row {
        grid-template-columns: minmax(0, 1fr) auto !important;
        gap: 8px 12px !important;
        padding: 11px 12px !important;
      }

      .simple-reservation-main {
        grid-column: 1 / -1 !important;
      }

      .simple-reservation-date,
      .simple-reservation-price,
      .simple-reservation-status {
        justify-self: start;
      }

      .simple-reservation-actions {
        grid-column: 1 / -1 !important;
        justify-content: flex-start !important;
        padding-top: 2px;
      }

      .simple-reservation-row .detail-row {
        margin: 4px -12px -11px !important;
      }

      .detail-grid {
        grid-template-columns: 1fr !important;
      }
    }

    @media (max-width: 560px) {
      .account-page {
        padding-left: 14px !important;
        padding-right: 14px !important;
      }

      .reservation-section-header {
        align-items: center !important;
        flex-direction: row !important;
      }

      .simple-reservation-row {
        grid-template-columns: 1fr 1fr !important;
      }

      .simple-reservation-date {
        grid-column: 1 / -1;
      }

      .simple-reservation-actions {
        display: grid !important;
        grid-template-columns: 1fr 1fr;
        width: 100%;
      }

      .simple-reservation-actions .reservation-primary-action,
      .simple-reservation-actions .offer-detail-link {
        width: 100%;
      }

      .simple-reservation-actions .reservation-primary-action.orange {
        grid-column: 1 / -1;
      }

      .reservation-detail-actions {
        justify-content: stretch !important;
      }

      .reservation-detail-actions .reservation-cancel-action {
        width: 100%;
      }
    }
  </style>
</head>
<body data-navigation-page="muj-ucet">

  <header class="header">
    <a href="index.html" class="logo">
      <div class="logo-icon">
        <img src="assets/rentulo-logo-mark.png" alt="" aria-hidden="true" />
      </div>

      <div class="logo-text">
        <strong>Rentulo</strong>
      </div>
    </a>

    <nav class="nav" id="mainNav"></nav>
  </header>

  <main class="account-page">

    <a href="muj-ucet.html" class="back-link" data-rentulo-back="true" data-i18n="reservations.back">← Zpět</a>
    <section class="account-page-header">


      <h1 data-i18n="reservations.heading">Moje rezervace</h1>

      <p data-i18n="reservations.description">Spravujte své rezervace a jejich průběh.</p>

      <a href="vysledky.html" class="top-action-button" data-i18n="reservations.findItem">Najít věc</a>
    </section>

    <div
      class="reservation-page-notice"
      id="reservationsNotice"
      role="status"
      aria-live="polite"
      hidden
    ></div>
    <section class="account-list" id="reservationsList"></section>
    <div
      class="reservation-confirm-modal"
      id="reservationCancelModal"
      aria-hidden="true"
      hidden
    >
      <div
        class="reservation-confirm-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="reservationCancelModalTitle"
        aria-describedby="reservationCancelModalDescription"
      >
        <h2 id="reservationCancelModalTitle">Zrušit rezervaci?</h2>
        <p id="reservationCancelModalDescription">
          Opravdu chcete tuto rezervaci zrušit? Termín se znovu uvolní.
        </p>
        <div class="reservation-confirm-actions">
          <button
            type="button"
            class="reservation-modal-button reservation-modal-keep"
            data-reservations-cancel-modal-action="keep"
          >
            Ponechat rezervaci
          </button>
          <button
            type="button"
            class="reservation-modal-button reservation-modal-cancel"
            data-reservations-cancel-modal-action="confirm"
          >
            Zrušit rezervaci
          </button>
        </div>
      </div>
    </div>
    <div
      class="reservation-confirm-modal"
      id="reservationPaymentModal"
      aria-hidden="true"
      hidden
    >
      <div
        class="reservation-confirm-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="reservationPaymentModalTitle"
        aria-describedby="reservationPaymentModalDescription"
      >
        <h2 id="reservationPaymentModalTitle">Potvrdit testovací platbu?</h2>
        <p id="reservationPaymentModalDescription">
          Jde o testovací platbu. Po potvrzení bude rezervace označena jako zaplacená.
        </p>
        <div class="reservation-confirm-actions">
          <button
            type="button"
            class="reservation-modal-button reservation-modal-keep"
            data-reservations-payment-modal-action="cancel"
          >
            Zpět
          </button>
          <button
            type="button"
            class="reservation-modal-button reservation-modal-pay"
            data-reservations-payment-modal-action="confirm"
          >
            Potvrdit platbu
          </button>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/reservation-utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/reservation-status.js"></script>
  <script src="js/reservations.js"></script>
  <script src="js/reservations-page.js"></script>
</body>
</html>
