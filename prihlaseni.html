<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title data-i18n="login.documentTitle">Přihlášení - Rentulo</title>
  <link rel="icon" type="image/png" href="assets/rentulo-logo-mark.png" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #dff7ee;
      color: #173f35;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font-family: inherit;
    }

    .header {
      max-width: 1240px;
      margin: 0 auto;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .logo-text strong {
      display: block;
      font-size: 25px;
      line-height: 1;
      color: #173f35;
    }

    .logo-text small {
      display: block;
      margin-top: 3px;
      font-size: 13px;
      color: #66736e;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 15px;
    }

    .nav a {
      font-weight: 500;
    }

    .nav .active-link {
      font-weight: 900;
    }

    .btn-register,
    .logout-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #6FCF65;
      color: #123F34 !important;
      padding: 10px 20px;
      border-radius: 999px;
      font-weight: 900;
      cursor: pointer;
    }

    .btn-register:hover,
    .logout-link:hover {
      background: #5DBA55;
    }

    .auth-page {
      max-width: 1240px;
      margin: 0 auto;
      padding: 26px 20px 40px;
      display: flex;
      justify-content: center;
    }

    .auth-card {
      width: 100%;
      max-width: 820px;
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 0;
      background: #ffffff;
      border: 1px solid #e1e6e8;
      border-radius: 18px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.04);
      overflow: hidden;
    }

    .auth-intro {
      padding: 26px;
      background: #f0faea;
      border-right: 1px solid #d4e9c8;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #4f972d;
      font-size: 13px;
      font-weight: 900;
    }

    .auth-intro h1 {
      margin: 0 0 12px;
      color: #173f35;
      font-size: 36px;
      line-height: 1.05;
      letter-spacing: -0.035em;
    }

    .auth-intro p {
      margin: 0;
      color: #4d5b55;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 700;
    }

    .auth-form {
      padding: 26px;
      display: grid;
      gap: 13px;
      align-content: start;
    }

    .auth-error-message {
      display: none;
      padding: 10px 12px;
      border-radius: 12px;
      background: #fff5ef;
      border: 1px solid #ffd7bf;
      color: #7a4321;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.35;
    }

    .auth-error-message.active {
      display: block;
    }

    .form-group {
      display: grid;
      gap: 7px;
    }

    .form-group label {
      color: #173f35;
      font-size: 14px;
      font-weight: 900;
    }

    .form-group input {
      width: 100%;
      min-height: 44px;
      border: 1px solid #d9e0e3;
      border-radius: 12px;
      background: #ffffff;
      padding: 10px 12px;
      font-size: 14px;
      color: #173f35;
      font-weight: 700;
      outline: none;
    }

    .form-group input:focus {
      border-color: #7ed957;
      box-shadow: 0 0 0 3px rgba(126, 217, 87, 0.22);
    }

    .form-group input.input-error {
      border-color: #c2410c;
      box-shadow: 0 0 0 3px rgba(194, 65, 12, 0.12);
    }

    .terms-check {
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 8px;
      align-items: start;
      padding: 10px 11px;
      border-radius: 12px;
      background: #f7fbf9;
      border: 1px solid #dce9e3;
      color: #4d5b55;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 700;
      cursor: pointer;
    }

    .terms-check input {
      width: 16px;
      height: 16px;
      margin: 1px 0 0;
      accent-color: #7ed957;
    }

    .auth-button {
      min-height: 44px;
      border: none;
      border-radius: 12px;
      background: #6FCF65;
      color: #123F34;
      padding: 0 18px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }

    .auth-button:hover {
      background: #5DBA55;
    }

    .auth-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .auth-note {
      margin: 0;
      padding-top: 2px;
      color: #4d5b55;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
    }

    .auth-note a {
      color: #3f7f2d;
      font-weight: 900;
      text-decoration: none;
    }

    .auth-note a:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .auth-note-right {
      margin-top: -3px;
      text-align: right;
    }

    .auth-helper-box {
      margin-top: 14px;
      padding: 11px 12px;
      border-radius: 12px;
      background: #eef7ea;
      border: 1px solid #d4e9c8;
      color: #173f35;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 800;
    }

    .auth-helper-box strong {
      display: block;
      margin-bottom: 3px;
      color: #4f972d;
    }

    @media (max-width: 820px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .nav {
        flex-wrap: wrap;
        gap: 12px;
      }

      .auth-card {
        grid-template-columns: 1fr;
      }

      .auth-intro {
        border-right: none;
        border-bottom: 1px solid #d4e9c8;
      }
    }

    @media (max-width: 620px) {
      .header,
      .auth-page {
        padding-left: 14px;
        padding-right: 14px;
      }

      .auth-page {
        padding-top: 12px;
      }

      .auth-intro,
      .auth-form {
        padding: 18px;
      }

      .auth-intro h1 {
        font-size: 30px;
      }

      .auth-button {
        width: 100%;
      }
    }
  </style>
</head>

<body data-navigation-page="prihlaseni">

  <header class="header">
    <a href="index.html" class="logo">
      <div class="logo-icon">
        <img src="assets/rentulo-logo-mark.png" alt="" aria-hidden="true" />
      </div>

      <div class="logo-text">
        <strong>Rentulo</strong>
      </div>
    </a>

    <nav class="nav" id="mainNav"></nav>
  </header>

  <main class="auth-page">

    <section class="auth-card">

      <div class="auth-intro">
        <p class="eyebrow" data-i18n="login.eyebrow">Vítejte zpět</p>

        <h1 data-i18n="login.title">Přihlášení</h1>

        <p data-i18n="login.description">
          Přihlaste se ke svému účtu. Poté se vrátíte na požadovanou stránku nebo na úvod Rentulo.
        </p>

        <div class="auth-helper-box">
          <strong data-i18n="login.helperTitle">Účet Rentulo</strong>
          <span data-i18n="login.helperText">Použijte e-mail a heslo zadané při registraci.</span>
        </div>
      </div>

      <form class="auth-form" id="loginForm" autocomplete="on">

        <div class="auth-error-message" id="loginError"></div>

        <div class="form-group full">
          <label for="loginEmail" data-i18n="login.emailLabel">E-mail</label>
          <input
  id="loginEmail"
  type="email"
  name="email"
  autocomplete="username"
  data-i18n-placeholder="login.emailPlaceholder"
  placeholder="např. jan@email.cz"
  required
/>
        </div>

        <div class="form-group full">
          <label for="loginPassword" data-i18n="login.passwordLabel">Heslo</label>
          <input
  id="loginPassword"
  type="password"
  name="password"
  autocomplete="current-password"
  data-i18n-placeholder="login.passwordPlaceholder"
  placeholder="Zadejte heslo"
  required
/>
        </div>

        <p class="auth-note auth-note-right">
          <a href="obnova-hesla.html" data-i18n="login.forgotPassword">Zapomněli jste heslo?</a>
        </p>

        <label class="terms-check">
          <input id="rememberLogin" type="checkbox" />
          <span data-i18n="login.remember">Zapamatovat přihlášení na tomto zařízení.</span>
        </label>

        <button type="submit" class="auth-button" id="loginSubmitButton" data-i18n="login.submit">
          Přihlásit se
        </button>

        <p class="auth-note">
          <span data-i18n="login.noAccount">Ještě nemáte účet?</span>
          <a href="registrace.html" data-i18n="login.createAccount">Vytvořit účet</a>
        </p>

      </form>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
<script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/login-page.js"></script>

</body>
</html>
