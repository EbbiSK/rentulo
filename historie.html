<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title data-i18n="history.pageTitle">Historie - Rentulo</title>

  <link rel="icon" type="image/png" href="assets/rentulo-logo-mark.png" />
  <link rel="stylesheet" href="css/account-pages.css" />
  <link rel="stylesheet" href="css/history.css" />
  <link rel="stylesheet" href="css/compact-records.css" />
</head>

<body data-navigation-page="muj-ucet">

  <header class="header">
    <a href="index.html" class="logo">
      <div class="logo-icon">
        <img src="assets/rentulo-logo-mark.png" alt="" width="40" height="40" aria-hidden="true" />
      </div>

      <div class="logo-text">
        <strong>Rentulo</strong>
      </div>
    </a>

    <nav class="nav" id="mainNav"></nav>
  </header>

  <main class="account-page">

    <a href="muj-ucet.html" class="back-link" data-rentulo-back="true" data-i18n="history.back">← Zpět</a>

    <section class="account-page-header">
      <h1 data-i18n="history.heading">Historie</h1>
      <p data-history-extra-i18n="history.subtitle">Dokončené rezervace, půjčení a hodnocení na jednom místě.</p>
    </section>

    <div class="history-switch">
      <button
        type="button"
        class="history-switch-button active"
        data-history-view="rentals"
        data-i18n="history.rentalsTab"
      >
        Historie mých rezervací
      </button>

      <button
        type="button"
        class="history-switch-button"
        data-history-view="offers"
        data-i18n="history.offersTab"
      >
        Historie mých nabídek
      </button>
    </div>

    <section
      class="reservation-section"
      id="rentalHistorySection"
    >
      <div id="rentalHistoryList"></div>
    </section>

    <section
      class="reservation-section"
      id="offerHistorySection"
      hidden
    >
      <div id="offerHistoryList"></div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/history-i18n.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/reservation-status.js"></script>
  <script src="js/history-page.js"></script>
  <script src="js/history-page-refresh.js"></script>

</body>
</html>
