<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title data-i18n="history.pageTitle">Historie - Rentulo</title>

  <link rel="icon" type="image/png" href="assets/rentulo-logo-mark.png" />
  <link rel="stylesheet" href="css/account-pages.css" />
  <link rel="stylesheet" href="css/history.css" />
  <link rel="stylesheet" href="css/compact-records.css" />

  <style>
    /* Mint visual refresh for History. Functional behavior stays unchanged. */
    body {
      background: #dff7ee !important;
      color: #173f35;
    }

    .header {
      padding-top: 12px !important;
      padding-bottom: 12px !important;
    }

    .logo-icon {
      width: 48px !important;
      height: 48px !important;
      flex-basis: 48px !important;
    }

    .logo-text strong {
      font-size: 25px !important;
      color: #173f35 !important;
    }

    .logo-text small {
      display: none !important;
    }

    .account-page {
      padding-top: 14px !important;
    }

    .back-link {
      margin-bottom: 8px !important;
      color: #3f8e28 !important;
    }

    .account-page-header {
      margin-bottom: 8px !important;
      padding: 22px 24px;
      border: 1px solid #cfe4da;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 12px 32px rgba(23, 63, 53, 0.055);
    }

    .account-page-header h1 {
      margin: 0 !important;
      font-size: 42px !important;
      color: #173f35 !important;
    }

    .history-switch {
      margin: 0 0 14px !important;
      border-color: #cfe4da !important;
      background: rgba(255, 255, 255, 0.9) !important;
      box-shadow: 0 8px 24px rgba(23, 63, 53, 0.045) !important;
    }

    .history-switch-button:hover {
      background: #eef8f3 !important;
    }

    .history-switch-button.active {
      background: #e8f6ef !important;
      color: #2f7f35 !important;
      box-shadow: inset 0 0 0 1px #bddfce !important;
    }

    .history-record,
    .section-empty-note {
      border-color: #cfe4da !important;
      box-shadow: 0 12px 32px rgba(23, 63, 53, 0.055) !important;
    }

    .history-detail {
      border-top-color: #dbece4 !important;
      background: #f5fbf8 !important;
    }

    .history-detail-grid > div,
    .history-review-box {
      border-color: #d5e8df !important;
      background: #fff !important;
    }

    .history-detail-button {
      background: #edf5f1 !important;
      color: #173f35 !important;
    }

    .history-detail-button:hover {
      background: #e2eee8 !important;
    }

    .history-primary-button {
      background: #73d64f !important;
      color: #173a22 !important;
    }

    .history-primary-button:hover {
      background: #67c945 !important;
    }

    .history-review-box select,
    .history-review-box textarea {
      border-color: #cfe0d8 !important;
    }

    .history-review-box select:focus,
    .history-review-box textarea:focus {
      outline: none;
      border-color: #cfe0d8 !important;
      box-shadow: none;
    }

    .history-review-box select:focus-visible,
    .history-review-box textarea:focus-visible {
      outline: 1px solid rgba(64, 127, 101, 0.52) !important;
      outline-offset: 1px !important;
      border-color: #cfe0d8 !important;
      box-shadow: none !important;
    }

    html[data-focus-input="pointer"] .history-review-box select:focus,
    html[data-focus-input="pointer"] .history-review-box textarea:focus {
      outline: none !important;
      outline-offset: 0 !important;
      border-color: #cfe0d8 !important;
      box-shadow: none !important;
    }

    .status-waiting,
    .warning,
    .alert-warning {
      background: #fff3e8 !important;
      color: #8a4b16 !important;
      border-color: #f2c79f !important;
    }

    @media (max-width: 820px) {
      .account-page {
        padding: 10px 14px 30px !important;
      }

      .account-page-header {
        padding: 18px 18px;
      }

      .account-page-header h1 {
        font-size: 36px !important;
      }

      .history-switch {
        display: grid !important;
        grid-template-columns: 1fr !important;
        width: 100%;
      }

      .history-switch-button {
        width: 100%;
      }

      .history-detail-grid,
      .history-review-grid {
        grid-template-columns: 1fr !important;
      }
    }
  </style>
</head>

<body data-navigation-page="muj-ucet">

  <header class="header">
    <a href="index.html" class="logo">
      <div class="logo-icon">
        <img src="assets/rentulo-logo-mark.png" alt="" width="40" height="40" aria-hidden="true" />
      </div>

      <div class="logo-text">
        <strong>Rentulo</strong>
      </div>
    </a>

    <nav class="nav" id="mainNav"></nav>
  </header>

  <main class="account-page">

    <a href="muj-ucet.html" class="back-link" data-rentulo-back="true" data-i18n="history.back">← Zpět</a>

    <section class="account-page-header">
      <h1 data-i18n="history.heading">Historie</h1>
    </section>

    <div class="history-switch">
      <button
        type="button"
        class="history-switch-button active"
        data-history-view="rentals"
      data-i18n="history.rentalsTab"
      >
        Historie mých rezervací
      </button>

      <button
        type="button"
        class="history-switch-button"
        data-history-view="offers"
      data-i18n="history.offersTab"
      >
        Historie mých nabídek
      </button>
    </div>

    <section
      class="reservation-section"
      id="rentalHistorySection"
    >
      <div id="rentalHistoryList"></div>
    </section>

    <section
      class="reservation-section"
      id="offerHistorySection"
      hidden
    >
      <div id="offerHistoryList"></div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
<script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/reservation-status.js"></script>
  <script src="js/history-page.js"></script>

</body>
</html>
