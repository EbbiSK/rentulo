<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title data-i18n="account.documentTitle">Můj účet - Rentulo</title>

  <link rel="icon" type="image/png" href="assets/rentulo-logo-mark.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/rentulo-theme.css" />
  <link rel="stylesheet" href="css/account-home.css" />
</head>

<body data-navigation-page="muj-ucet">
  <header class="header">
    <a href="index.html" class="logo" aria-label="Rentulo">
      <div class="logo-icon">
        <img src="assets/rentulo-logo-mark.png" alt="" width="48" height="48" aria-hidden="true" />
      </div>
      <div class="logo-text">
        <strong>Rentulo</strong>
      </div>
    </a>

    <nav class="nav" id="mainNav"></nav>
  </header>

  <main class="account-page">
    <section class="account-shell" aria-labelledby="accountTitle">
      <header class="account-heading">
        <h1 id="accountTitle" data-account-i18n="accountHome.title">Můj účet</h1>
        <p data-account-i18n="accountHome.subtitle">Spravujte svůj profil a nastavení účtu.</p>
      </header>

      <div class="account-load-status" id="accountLoadStatus" role="status" aria-live="polite">
        <span id="accountLoadStatusText" data-i18n="account.load.loading">Načítám údaje účtu...</span>
        <button
          class="account-load-retry"
          id="accountLoadRetry"
          type="button"
          data-i18n="account.load.retry"
          hidden
        >
          Zkusit znovu
        </button>
      </div>

      <section class="account-profile-card" id="accountProfileCard" aria-label="Profil" hidden>
        <div class="account-profile-avatar" id="profileAvatar" aria-hidden="true">U</div>
        <div class="account-profile-copy">
          <strong id="profileName">Uživatel</strong>
          <span id="profileEmail">email@example.cz</span>
          <small id="profileRating">Hodnocení: zatím bez hodnocení</small>
        </div>
      </section>

      <a href="nastaveni.html" class="account-settings-link">
        <span class="account-settings-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.18.36.39.67.6 1 .28.39.63.6 1.1.6H21v4h-.09c-.47 0-.82.21-1.1.6-.21.33-.42.64-.6 1Z"></path>
          </svg>
        </span>

        <span class="account-settings-copy">
          <strong data-account-i18n="accountHome.settingsTitle">Nastavení účtu</strong>
          <span data-account-i18n="accountHome.settingsDescription">Osobní údaje, jazyk, heslo a zabezpečení účtu.</span>
        </span>

        <span class="account-settings-arrow" aria-hidden="true">→</span>
      </a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/account-i18n.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/account-page.js"></script>
</body>
</html>
