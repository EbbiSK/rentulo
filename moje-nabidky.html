<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title data-i18n="offers.pageTitle">Moje nabídky - Rentulo</title>
  <link rel="icon" type="image/png" href="assets/rentulo-logo-mark.png" />
<link rel="stylesheet" href="css/account-pages.css" />
  <link rel="stylesheet" href="css/my-offers.css" />
  <link rel="stylesheet" href="css/compact-records.css" />

  <style>
    /* Mint visual refresh for My offers. Functional behavior stays unchanged. */
    body {
      background: #dff7ee !important;
      color: #173f35;
    }

    .header {
      padding-top: 12px !important;
      padding-bottom: 12px !important;
    }

    .logo-icon {
      width: 48px !important;
      height: 48px !important;
      flex-basis: 48px !important;
    }

    .logo-text strong {
      font-size: 25px !important;
      color: #173f35 !important;
    }

    .logo-text small {
      display: none !important;
    }

    .account-page {
      padding-top: 18px !important;
    }

    .back-link {
      color: #3f8f2d !important;
    }

    .account-page-header {
      margin-bottom: 16px !important;
      padding: 20px 190px 20px 20px !important;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid #cde5da;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(23, 63, 53, 0.05);
    }

    .account-page-header h1 {
      color: #173f35 !important;
    }

    .top-action-button {
      top: 50% !important;
      right: 20px !important;
      transform: translateY(-50%);
      background: #73d64f !important;
      color: #173a22 !important;
      box-shadow: none !important;
    }

    .top-action-button:hover {
      background: #63c943 !important;
    }

    .account-message {
      background: #eff9f4 !important;
      border-color: #c9e2d6 !important;
    }

    .account-message.error {
      background: #fff8f6 !important;
      border-color: #efc1b7 !important;
      color: #6f2d25 !important;
    }

    .account-message.error strong {
      color: #a43b2f !important;
    }

    .offers-table-card,
    .account-empty-state,
    .simple-offer-row {
      border-color: #cfe3da !important;
      box-shadow: 0 12px 30px rgba(23, 63, 53, 0.055) !important;
    }

    .offer-table-head,
    .offer-row:hover,
    .offer-detail,
    .request-panel-header,
    .request-detail,
    .history-detail {
      background: #f5fbf8 !important;
    }

    .tool-image,
    .mini-stat,
    .request-panel,
    .money-cell,
    .request-contact-box {
      border-color: #d5e7df !important;
    }

    .tool-image {
      background: #edf7f2 !important;
    }

    .small-button,
    .offer-primary-button,
    .simple-offer-actions button:not(.danger) {
      background: #73d64f !important;
      color: #173a22 !important;
    }

    .small-button:hover,
    .offer-primary-button:hover,
    .simple-offer-actions button:not(.danger):hover {
      background: #63c943 !important;
    }

    .small-button.light,
    .request-toggle-button:not(.important),
    .history-toggle-button,
    .simple-offer-actions a,
    .simple-offer-actions .simple-offer-more-menu summary,
    .offer-card-controls .offer-secondary-link {
      background: #edf5f1 !important;
      color: #173f35 !important;
    }

    .simple-offer-actions,
    .offer-card-controls {
      flex-wrap: wrap !important;
    }

    .offer-card-controls .offer-secondary-link,
    .offer-card-controls .offer-delete-action {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
      cursor: pointer;
    }

    .simple-offer-actions .offer-delete-action,
    .offer-card-controls .offer-delete-action {
      background: #fff8f6 !important;
      color: #a43b2f !important;
      border: 1px solid #efc1b7 !important;
    }

    .simple-offer-actions .offer-delete-action:hover,
    .offer-card-controls .offer-delete-action:hover {
      background: #fff0ec !important;
    }

    .simple-offer-actions .offer-visibility-action.deactivate {
      background: #edf5f1 !important;
      color: #173f35 !important;
    }

    .simple-offer-actions .offer-visibility-action.deactivate:hover {
      background: #e2efe9 !important;
    }

    .simple-offer-status.status-hidden {
      background: #eef1ed !important;
      color: #334c43 !important;
    }

    /* Attention states remain orange, but use a softer peach palette. */
    .status-pill.draft,
    .request-status,
    .count-pill.important,
    .status-pending,
    .status-approved,
    .status-draft,
    .request-note {
      background: #fff3e8 !important;
      color: #8a4b16 !important;
      border-color: #f2c79f !important;
    }

    .request-status.paid {
      background: #eef8e9 !important;
      color: #4f9f2f !important;
      border-color: #c9e2d6 !important;
    }

    .small-button.orange,
    .request-toggle-button.important,
    .simple-offer-actions .urgent {
      background: #ff6a00 !important;
      color: #fff !important;
    }

    .small-button.orange:hover,
    .request-toggle-button.important:hover,
    .simple-offer-actions .urgent:hover {
      background: #e85f00 !important;
    }

    /* Paid reservation row: give the next step more breathing room without adding visual noise. */
    .request-row {
      min-height: 56px !important;
      column-gap: 14px !important;
      padding: 11px 12px !important;
    }

    .request-row .row-actions {
      gap: 10px !important;
    }

    .request-row .small-button.orange {
      background: #fff3e8 !important;
      color: #8a4b16 !important;
      border: 1px solid #efbd8e !important;
    }

    .request-row .small-button.orange:hover {
      background: #ffe8d3 !important;
    }

    .account-empty-state a {
      background: #73d64f !important;
      color: #173a22 !important;
    }

    @media (max-width: 820px) {
      .logo-icon {
        width: 48px !important;
        height: 48px !important;
        flex-basis: 48px !important;
      }

      .account-page-header {
        padding: 18px !important;
      }

      .top-action-button {
        transform: none !important;
        width: 100%;
        justify-content: center;
      }
    }
  </style>

</head>

<body data-navigation-page="muj-ucet">

  <header class="header">
    <a href="index.html" class="logo">
      <div class="logo-icon">
        <img src="assets/rentulo-logo-mark.png" alt="" width="40" height="40" aria-hidden="true" />
      </div>

      <div class="logo-text">
        <strong>Rentulo</strong>
      </div>
    </a>

    <nav class="nav" id="mainNav"></nav>
  </header>

  <main class="account-page">

    <a href="muj-ucet.html" class="back-link" data-i18n="offers.back">← Zpět do účtu</a>

    <section class="account-page-header">
      

      <h1 data-i18n="offers.heading">Moje nabídky</h1>

      <p data-i18n="offers.description">Spravujte své nabídky a žádosti zájemců.</p>

      <a href="nabidnout.html" class="top-action-button" data-i18n="offers.addItem">Přidat věc</a>
    </section>

    <div class="account-message" id="accountMessage"></div>

    <section class="account-list" id="offersList"></section>

    <div
      class="offers-confirm-modal"
      id="offerDeleteModal"
      aria-hidden="true"
      hidden
    >
      <div
        class="offers-confirm-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="offerDeleteModalTitle"
        aria-describedby="offerDeleteModalDescription"
      >
        <h2 id="offerDeleteModalTitle">Smazat nabídku?</h2>
        <p id="offerDeleteModalDescription">Opravdu chcete tuto nabídku smazat?</p>
        <div class="offers-confirm-actions">
          <button
            type="button"
            class="offers-modal-button offers-modal-keep"
            data-offers-delete-modal-action="cancel"
          >
            Ponechat nabídku
          </button>
          <button
            type="button"
            class="offers-modal-button offers-modal-delete"
            data-offers-delete-modal-action="confirm"
          >
            Smazat nabídku
          </button>
        </div>
      </div>
    </div>

  </main>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/utils.js"></script>
<script src="js/offer-utils.js"></script>
<script src="js/reservation-utils.js"></script>
<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/storage.js"></script>
<script src="js/navigation.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/reservation-status.js"></script>
<script src="js/reservations.js"></script>
<script src="js/offers-page.js"></script>

</body>
</html>
