<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="passwordRecovery.documentTitle">Obnova hesla - Rentulo</title>
  <link rel="icon" type="image/png" href="assets/rentulo-logo-mark.png" />
  <link id="rentuloSharedTheme" rel="stylesheet" href="css/rentulo-theme.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>

<body data-navigation-page="prihlaseni">
  <header class="header">
    <a href="index.html" class="logo">
      <div class="logo-icon">
        <img src="assets/rentulo-logo-mark.png" alt="" aria-hidden="true" />
      </div>
      <div class="logo-text"><strong>Rentulo</strong></div>
    </a>
    <nav class="nav" id="mainNav"></nav>
  </header>

  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-intro">
        <p class="eyebrow" data-i18n="passwordRecovery.eyebrow">Bezpečné obnovení</p>
        <h1 id="recoveryTitle" data-i18n="passwordRecovery.title">Obnova hesla</h1>
        <p id="recoveryDescription" data-i18n="passwordRecovery.description">
          Zadejte e-mail použitý při registraci. Pošleme vám odkaz pro nastavení nového hesla.
        </p>
      </div>

      <form class="auth-form" id="requestResetForm" novalidate>
        <div class="status-message" id="requestMessage" role="status" aria-live="polite"></div>

        <div class="form-group full">
          <label for="recoveryEmail" data-i18n="passwordRecovery.emailLabel">E-mail</label>
          <input
            id="recoveryEmail"
            type="email"
            autocomplete="email"
            inputmode="email"
            autocapitalize="none"
            spellcheck="false"
            maxlength="254"
            data-i18n-placeholder="passwordRecovery.emailPlaceholder"
            placeholder="např. jan@email.cz"
            required
          />
        </div>

        <button type="submit" class="auth-button" id="requestResetButton" data-i18n="passwordRecovery.send">
          Poslat odkaz pro obnovu
        </button>

        <p class="auth-note">
          <a href="prihlaseni.html" data-i18n="passwordRecovery.backToLogin">Zpět na přihlášení</a>
        </p>
      </form>

      <form class="auth-form hidden" id="setPasswordForm" novalidate>
        <div class="status-message" id="passwordMessage" role="status" aria-live="polite"></div>

        <div class="form-group full">
          <label for="newPassword" data-i18n="passwordRecovery.newPassword">Nové heslo</label>
          <input
            id="newPassword"
            type="password"
            autocomplete="new-password"
            minlength="8"
            aria-describedby="recoveryDescription"
            required
          />
        </div>

        <div class="form-group full">
          <label for="confirmPassword" data-i18n="passwordRecovery.confirmPassword">Potvrzení nového hesla</label>
          <input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            minlength="8"
            aria-describedby="recoveryDescription"
            required
          />
        </div>

        <button type="submit" class="auth-button" id="savePasswordButton" data-i18n="passwordRecovery.save">
          Uložit nové heslo
        </button>

        <p class="auth-note">
          <a href="prihlaseni.html" data-i18n="passwordRecovery.backToLogin">Zpět na přihlášení</a>
        </p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/password-recovery-page.js"></script>
</body>
</html>
